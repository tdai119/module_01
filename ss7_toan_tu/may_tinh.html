<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ứng dụng máy tính</title>
</head>
<body>

<h2>Ứng dụng máy tính</h2>

<input type="number" id="num1" placeholder="Nhập số 1">
<input type="number" id="num2" placeholder="Nhập số 2">
<br><br>

<button onclick="add()">Addition (+)</button>
<button onclick="sub()">Subtraction (-)</button>
<button onclick="mul()">Multiplication (×)</button>
<button onclick="div()">Division (/)</button>

<p id="result"></p>

<script>
    function add() {
        let a = parseFloat(document.getElementById("num1").value);
        let b = parseFloat(document.getElementById("num2").value);
        document.getElementById("result").innerText = "Result: " + (a + b);
    }

    function sub() {
        let a = parseFloat(document.getElementById("num1").value);
        let b = parseFloat(document.getElementById("num2").value);
        document.getElementById("result").innerText = "Result: " + (a - b);
    }

    function mul() {
        let a = parseFloat(document.getElementById("num1").value);
        let b = parseFloat(document.getElementById("num2").value);
        document.getElementById("result").innerText = "Result: " + (a * b);
    }

    function div() {
        let a = parseFloat(document.getElementById("num1").value);
        let b = parseFloat(document.getElementById("num2").value);

        if (b === 0) {
            document.getElementById("result").innerText = "Không thể chia cho 0!";
            return;
        }

        document.getElementById("result").innerText = "Result: " + (a / b);
    }
</script>

</body>
</html>
