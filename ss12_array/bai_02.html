<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 2</title>
</head>
<body>

<h3>Bài 2</h3>
<p id="out"></p>

<script>
    let arr = [5, 12, 9, 20, 3, 7, 15, 2, 10, 8];

    let max = arr[0];
    let index = 0;

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > max) {
            max = arr[i];
            index = i;
        }
    }

    document.getElementById("out").innerHTML =
        "Giá trị lớn nhất: " + max + "<br>Vị trí: " + index;
</script>

</body>
</html>
