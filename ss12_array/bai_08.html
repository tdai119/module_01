<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 8</title>
</head>
<body>
<h3>Bài 8</h3>
<p id="out"></p>

<script>
    let arr = [5, 1, 9, 3, 7, 2, 8, 10, 4, 6];

    for (let i = 0; i < arr.length - 1; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] < arr[j]) {
                let temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
        }
    }

    document.getElementById("out").innerHTML =
        "Mảng giảm dần: " + arr.join(", ");
</script>
</body>
</html>
