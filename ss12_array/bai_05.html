<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
</head>
<body>
<p id="out"></p>

<script>
    let arr = [3, -4, 5, -1, 0, -9, 10];
    let count = 0;

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] < 0) count++;
    }

    document.getElementById("out").innerHTML =
        "Có " + count + " số nguyên âm.";
</script>
</body>
</html>
