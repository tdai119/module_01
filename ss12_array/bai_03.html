<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>

<h3>Bài 3</h3>
<p id="out"></p>

<script>
    let arr = [5, 8, 12, 15, 4, 6, 2, 18, 26];
    let max = arr[0];
    let sum = 0;

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] > max) {
            max = arr[i];
        }
        sum += arr[i];
    }

    let avg = sum / arr.length;

    document.getElementById("out").innerHTML =
        "Giá trị lớn nhất: " + max +
        "<br>Giá trị trung bình: " + avg;
</script>

</body>
</html>
