<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Temperature Demo</title>
</head>
<body>

<h2>Mô phỏng nhiệt độ bằng lớp Temperature</h2>

<p id="output"></p>

<script>
    class Temperature {
        constructor(celsius) {
            if (celsius < -273) {
                throw new Error("Nhiệt độ không thể nhỏ hơn -273°C");
            }
            this.celsius = celsius;
        }

        toFahrenheit() {
            return (this.celsius * 9/5) + 32;
        }

        toKelvin() {
            return this.celsius + 273.15;
        }
    }

    const temp = new Temperature(25);

    document.getElementById("output").innerHTML =
        "Nhiệt độ C: " + temp.celsius + "°C" +
        "<br>Nhiệt độ F: " + temp.toFahrenheit().toFixed(2) + "°F" +
        "<br>Nhiệt độ K: " + temp.toKelvin().toFixed(2) + " K";
</script>

</body>
</html>
