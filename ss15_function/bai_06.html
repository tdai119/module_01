<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>

<h3>Bài 6</h3>
<p id="out"></p>

<script>
    function isPositive(n) {
        return Number.isInteger(n) && n > 0;
    }

    let n = Number(prompt("Nhập số:"));
    document.getElementById("out").innerHTML = isPositive(n);
</script>

</body>
</html>
