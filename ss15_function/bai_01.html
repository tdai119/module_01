<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
</head>
<body>

<h3>Bài 1</h3>
<p id="out"></p>

<script>
    function square(n) {
        return n * n;
    }

    let num = Number(prompt("Nhập số:"));
    document.getElementById("out").innerHTML = "Bình phương = " + square(num);
</script>

</body>
</html>
