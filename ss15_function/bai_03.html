<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>

<h3>Bài 3</h3>
<p id="out"></p>

<script>
    function factorial(n) {
        let f = 1;
        for (let i = 1; i <= n; i++) f *= i;
        return f;
    }

    let n = Number(prompt("Nhập số:"));
    document.getElementById("out").innerHTML = "Giai thừa = " + factorial(n);
</script>

</body>
</html>
