<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>
<h3>20 số đầu tiên trong dãy fibonacci</h3>
<script>
    let a = 0, b = 1;

    document.write(a + "<br>");
    document.write(b + "<br>");

    for (let i = 3; i <= 20; i++) {
        let c = a + b;
        document.write(c + "<br>");
        a = b;
        b = c;
    }
</script>
</body>
</html>
