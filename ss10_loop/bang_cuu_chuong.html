<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bảng cửu chương</title>
</head>
<body>

    <h2>Bảng cửu chương</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <script>

            for (let i = 1; i <= 9; i++) {
                document.write("<tr>");

                for (let j = 2; j <= 9; j++) {
                    document.write("<td>" + j + " x " + i + " = " + (i * j) + "</td>");
                }

                document.write("</tr>");
            }
        </script>
    </table>

</body>
</html>
