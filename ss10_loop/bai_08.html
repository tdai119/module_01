<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 8</title>
</head>
<body>

<button onclick="playGame()">Chơi</button>

<script>
    function playGame() {
        let min = prompt("Nhập số nhỏ nhất của khoảng muốn đoán:");

        if (min === null || min.trim() === "" || isNaN(min)) {
            alert("Giá trị không hợp lệ!");
            return;
        }
        min = Number(min);

        let max = prompt("Nhập số lớn nhất của khoảng muốn đoán:");

        if (max === null || max.trim() === "" || isNaN(max)) {
            alert("Giá trị không hợp lệ!");
            return;
        }
        max = Number(max);

        if (min >= max) {
            alert("Max phải lớn hơn Min!");
            return;
        }

        let randomNum = Math.floor(Math.random() * (max - min + 1)) + min;

        let chances = 3;

        while (chances > 0) {
            let guess = prompt(`Nhập số bạn đoán (${min} → ${max}) - Còn ${chances} lần:`);

            if (guess === null) {
                alert("Bạn đã hủy lượt chơi.");
                return;
            }

            if (guess.trim() === "" || isNaN(guess)) {
                alert("Giá trị không hợp lệ!");
                continue;
            }

            guess = Number(guess);

            if (guess === randomNum) {
                alert("🎉 Chúc mừng! Bạn đã đoán đúng!");
                return;
            } else if (guess > randomNum) {
                alert("Sai! Số bạn đoán LỚN hơn số đúng.");
            } else {
                alert("Sai! Số bạn đoán NHỎ hơn số đúng.");
            }

            chances--;
        }

        alert("Hết lượt! Số đúng là: " + randomNum);
    }
</script>

</body>
</html>
