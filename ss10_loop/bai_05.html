<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
</head>
<body>
<script>
    let a = 0, b = 1;
    let sum = a + b;

    for (let i = 3; i <= 20; i++) {
        let c = a + b;
        sum += c;
        a = b;
        b = c;
    }

    alert("Tổng 20 số Fibonacci đầu tiên là: " + sum);
</script>
</body>
</html>
