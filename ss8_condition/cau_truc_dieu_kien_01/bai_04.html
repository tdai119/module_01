<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
</head>
<body>

<h3>Bài 4: Tìm số nguyên lớn nhất</h3>

<input id="a" type="number" placeholder="Số thứ 1">
<input id="b" type="number" placeholder="Số thứ 2">
<input id="c" type="number" placeholder="Số thứ 3">
<button onclick="findMax()">Tìm max</button>

<p id="result"></p>

<script>
    function findMax() {
        let a = parseInt(document.getElementById("a").value);
        let b = parseInt(document.getElementById("b").value);
        let c = parseInt(document.getElementById("c").value);

        let max = a;

        if (b > max) max = b;
        if (c > max) max = c;

        document.getElementById("result").innerText = "Số lớn nhất là: " + max;
    }
</script>

</body>
</html>
