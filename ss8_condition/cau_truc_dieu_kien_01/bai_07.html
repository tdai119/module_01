<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 7</title>
</head>
<body>

<h3>Bài 7: Tính cước điện thoại</h3>

<input id="minutes" type="number" placeholder="Số phút gọi">
<button onclick="calcFee()">Tính cước</button>

<p id="result"></p>

<script>
    function calcFee() {
        let m = parseFloat(document.getElementById("minutes").value);
        let fee;

        if (m <= 50) fee = m * 600;
        else if (m <= 200) fee = 50 * 600 + (m - 50) * 400;
        else fee = 50 * 600 + 150 * 400 + (m - 200) * 200;

        document.getElementById("result").innerText =
            "Cước điện thoại: " + fee.toLocaleString() + " VND";
    }
</script>

</body>
</html>
