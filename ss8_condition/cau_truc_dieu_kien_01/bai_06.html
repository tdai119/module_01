<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>

<h3>Bài 6: Tính hoa hồng</h3>

<input id="sales" type="number" placeholder="Doanh số bán hàng">
<button onclick="calcBonus()">Tính hoa hồng</button>

<p id="result"></p>

<script>
    function calcBonus() {
        let s = parseFloat(document.getElementById("sales").value);
        let bonus;

        if (s >= 100000000) bonus = s * 0.10;
        else if (s >= 50000000) bonus = s * 0.07;
        else if (s >= 20000000) bonus = s * 0.05;
        else bonus = s * 0.02;

        document.getElementById("result").innerText =
            "Hoa hồng nhận được: " + bonus.toLocaleString() + " VND";
    }
</script>

</body>
</html>
