<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>

<h3>Bài 3: Kiểm tra số nguyên</h3>

<input id="num" type="number" placeholder="Nhập số nguyên">
<button onclick="checkNumber()">Kiểm tra</button>

<p id="result"></p>

<script>
    function checkNumber() {
        let n = parseInt(document.getElementById("num").value);

        if (n > 0) {
            document.getElementById("result").innerText = "Số lớn hơn 0";
        } else if (n < 0) {
            document.getElementById("result").innerText = "Số nhỏ hơn 0";
        } else {
            document.getElementById("result").innerText = "Số bằng 0";
        }
    }
</script>

</body>
</html>
