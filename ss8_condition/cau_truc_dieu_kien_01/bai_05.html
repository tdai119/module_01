<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
</head>
<body>

<h3>Bài 5: Xếp loại học lực</h3>

<input id="kt" type="number" placeholder="Điểm kiểm tra">
<input id="gk" type="number" placeholder="Điểm giữa kỳ">
<input id="ck" type="number" placeholder="Điểm cuối kỳ">
<button onclick="rank()">Xếp loại</button>

<p id="result"></p>

<script>
    function rank() {
        let kt = parseFloat(document.getElementById("kt").value);
        let gk = parseFloat(document.getElementById("gk").value);
        let ck = parseFloat(document.getElementById("ck").value);

        let avg = (kt + gk + ck) / 3;
        let type;

        if (avg >= 8) type = "Giỏi";
        else if (avg >= 6.5) type = "Khá";
        else if (avg >= 5) type = "Trung bình";
        else type = "Yếu";

        document.getElementById("result").innerText =
            `Điểm trung bình: ${avg.toFixed(2)} — Xếp loại: ${type}`;
    }
</script>

</body>
</html>
