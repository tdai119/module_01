<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
</head>
<body>
    <h3>Bài 1: Kiểm tra a có chia hết cho b không</h3>
    <input id="a" type="number" placeholder="Nhập số a">
    <input id="b" type="number" placeholder="Nhập số b">
    <button onclick="checkDivide()">Kiểm tra</button>

    <p id="result"></p>
    <script>
        function checkDivide() {
            let a = parseFloat(document.getElementById('a').value);
            let b = parseFloat(document.getElementById('b').value);

            if (b === 0){
                document.getElementById("result").innerText = "Không thể chia cho 0";
                return;
            }
            if (a % b === 0) {
                document.getElementById("result").innerText = a + " chia hết cho " +b;
            }
            else {
                document.getElementById("result").innerText = a + " không chia hết cho " +b;
            }
        }
    </script>
</body>
</html>
