<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bài 1 - Đổi độ C sang độ F</title>
</head>
<body>
<h2>Bài 1: Chuyển độ C sang độ F</h2>

<input type="number" id="c" placeholder="Nhập độ C">
<button onclick="convert()">Đổi</button>

<p id="result"></p>

<script>
    function convert() {
        let c = document.getElementById("c").value;

        if (c === "") {
            document.getElementById("result").innerText = "⚠ Vui lòng nhập số độ C!";
        } else {
            let f = c * 9/5 + 32;
            document.getElementById("result").innerText = c + "°C = " + f + "°F";
        }
    }
</script>
</body>
</html>
