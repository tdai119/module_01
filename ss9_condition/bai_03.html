<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3 - Diện tích hình vuông</title>
</head>
<body>
<h2>Bài 3: Tính diện tích hình vuông</h2>

<input type="number" id="a" placeholder="Nhập cạnh a">
<button onclick="calc()">Tính</button>

<p id="result"></p>

<script>
    function calc() {
        let a = document.getElementById("a").value;

        if (a === "") {
            document.getElementById("result").innerText = "Vui lòng nhập chiều dài cạnh!";
        } else if (a <= 0) {
            document.getElementById("result").innerText = "Cạnh phải lớn hơn 0";
        } else {
            let s = a * a;
            document.getElementById("result").innerText = "Diện tích = " + s;
        }
    }
</script>
</body>
</body>
</html>
