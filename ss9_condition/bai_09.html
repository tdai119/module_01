<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 9</title>
</head>
<body>
<h3>Kiểm tra tam giác</h3>

<input type="number" id="a" placeholder="a">
<input type="number" id="b" placeholder="b">
<input type="number" id="c" placeholder="c">
<button onclick="check()">Kiểm tra</button>

<p id="result"></p>

<script>
    function check() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let c = parseFloat(document.getElementById("c").value);

        if (a > 0 && b > 0 && c > 0 &&
            a + b > c &&
            a + c > b &&
            b + c > a) {

            document.getElementById("result").innerText = "Đây là 3 cạnh của tam giác";
        } else {
            document.getElementById("result").innerText = "Không phải tam giác";
        }
    }
</script>
</body>
</html>
