<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>
<h3>Giải phương trình bậc 1: ax + b = 0</h3>

<input type="number" id="a" placeholder="a">
<input type="number" id="b" placeholder="b">
<button onclick="solve()">Giải</button>

<p id="result"></p>

<script>
    function solve() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);

        if (a === 0) {
            if (b === 0) document.getElementById("result").innerText = "Vô số nghiệm";
            else document.getElementById("result").innerText = "Vô nghiệm";
        } else {
            document.getElementById("result").innerText = "x = " + (-b / a);
        }
    }
</script>
</body>
</html>
