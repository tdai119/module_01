<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 7</title>
</head>
<body>
<h3>Giải phương trình bậc 2: ax² + bx + c = 0</h3>

<input type="number" id="a" placeholder="a">
<input type="number" id="b" placeholder="b">
<input type="number" id="c" placeholder="c">
<button onclick="solve()">Giải</button>

<p id="result"></p>

<script>
    function solve() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let c = parseFloat(document.getElementById("c").value);

        if (a === 0) {
            document.getElementById("result").innerText = "Không phải phương trình bậc 2";
            return;
        }

        let delta = b*b - 4*a*c;

        if (delta < 0) {
            document.getElementById("result").innerText = "Vô nghiệm";
        } else if (delta === 0) {
            document.getElementById("result").innerText = "Nghiệm kép x = " + (-b/(2*a));
        } else {
            let x1 = (-b + Math.sqrt(delta)) / (2*a);
            let x2 = (-b - Math.sqrt(delta)) / (2*a);
            document.getElementById("result").innerText = "x₁ = " + x1 + ", x₂ = " + x2;
        }
    }
</script>
</body>
</html>
