<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 2 - Đổi mét sang feet</title>
</head>
<body>
<h2>Bài 2: Chuyển từ mét sang feet</h2>

<input type="number" id="m" placeholder="Nhập mét">
<button onclick="convert()">Đổi</button>

<p id="result"></p>

<script>
    function convert() {
        let m = document.getElementById("m").value;

        if (m === "") {
            document.getElementById("result").innerText = "Vui lòng nhập số mét!";
        } else if (m < 0) {
            document.getElementById("result").innerText = "Mét phải là số không âm!";
        } else {
            let ft = m * 3.2808;
            document.getElementById("result").innerText = m + " mét = " + ft + " feet";
        }
    }
</script>
</body>
</html>
