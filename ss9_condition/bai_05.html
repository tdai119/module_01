<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5 - Tính diện tích tam giác vuông</title>
</head>
<body>
<h2>Bài 4: Tính diện tích hình tam giác vuông</h2>

<input type="number" id="a" placeholder="Nhập cạnh a">
<input type="number" id="b" placeholder="Nhập cạnh b">
<button onclick="calc()">Tính</button>

<p id="result"></p>

<script>
    function calc() {
        let a = document.getElementById("a").value;
        let b = document.getElementById("b").value;

        if (a === "" || b === "") {
            document.getElementById("result").innerText = "Vui lòng nhập đầy đủ chiều dài và chiều rộng.";
        }

        else if (a <= 0 || b <= 0){
            document.getElementById("result").innerText = "Chiều dài 2 cạnh phải lớn hơn 0.";
        }

        else {
            let s = (a * b) / 2;

            document.getElementById("result").innerText = "Diện tích = "+s;
        }

    }
</script>
</body>
</html>
