<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>
<h3>Bài 3</h3>
<p id="output"></p>
<script>
    let input = prompt("Nhập mảng số, cách nhau bởi dấu ,");
    let arr = input.split(",").map(Number);
    let ok = true;

    for (let i = 0; i < arr.length/2; i++) {
        if(arr[i] !== arr[arr.length-1-i]){
            ok = false;
            break;
        }
    }

    document.getElementById("output").innerHTML =
        arr.join(", ") +"<br>"+ (ok ? "OK" : "NO");
</script>
</body>
</html>
