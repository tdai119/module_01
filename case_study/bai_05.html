<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
</head>
<h3>Bài 5</h3>
<p id="out"></p>

<script>
    function findMaxNumber(n) {
        if (n < 1000 || n > 9999) return -1;

        let s = n.toString();
        let max = 0;

        for (let i = 0; i < s.length; i++) {
            let temp = s.slice(0, i) + s.slice(i + 1);
            let num = Number(temp);
            if (num > max) max = num;
        }

        return max;
    }

    let input = Number(prompt("Nhập số n:"));
    document.getElementById("out").innerHTML = findMaxNumber(input);
</script>

</body>
</html>
