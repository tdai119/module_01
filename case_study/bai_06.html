<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bài 6</title>
</head>
<body>
<h3>Bài 6</h3>
<p id="out"></p>

<script>
    let arr = prompt("Nhập mảng số, cách nhau bởi dấu ,");
    let even = arr.every(x => x % 2 === 0);
    let odd = arr.every(x => x % 2 !== 0);

    document.getElementById("out").innerHTML =
        even ? 1 : odd ? 0 : -1;
</script>
</body>
</html>
